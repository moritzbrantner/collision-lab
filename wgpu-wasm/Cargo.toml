[package]
name = "collision-lab-wgpu-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
glam = { version = "0.30", features = ["bytemuck"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }
