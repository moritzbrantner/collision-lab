[package]
name = "collision-lab-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "af1d20ac8e8abcdbf6593edada42aa151b0e1628" }
bvh-trace-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "af1d20ac8e8abcdbf6593edada42aa151b0e1628" }
collision-lab = { path = ".." }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "af1d20ac8e8abcdbf6593edada42aa151b0e1628" }
serde_json = "1"
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "af1d20ac8e8abcdbf6593edada42aa151b0e1628" }
wasm-bindgen = "0.2"
