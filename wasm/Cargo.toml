collision-lab = { path = ".." }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "7c4cc7c9e1c432969a28304db39f8b11e08f8129" }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "7c4cc7c9e1c432969a28304db39f8b11e08f8129" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "ab55850bb7b24b65ba00425d3bde2b91eb1568a0" }
