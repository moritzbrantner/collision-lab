license = "MIT"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "127d9e46fc47ca8b6ceed1c42a397862365b6078" }
