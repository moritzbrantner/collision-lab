[package]
name = "collision-lab-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "f0c248dadd8c558a24d439eec1b7b4ffd354ef82" }
bvh-trace-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "f0c248dadd8c558a24d439eec1b7b4ffd354ef82" }
collision-lab = { path = ".." }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "f0c248dadd8c558a24d439eec1b7b4ffd354ef82" }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "f0c248dadd8c558a24d439eec1b7b4ffd354ef82" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "cda9d1df803eee28fca39088b0fa23753fab7233" }
serde_json = "1"
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "f0c248dadd8c558a24d439eec1b7b4ffd354ef82" }
wasm-bindgen = "0.2"
