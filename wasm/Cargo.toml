[package]
name = "collision-lab-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "2082c4e64afaf2af605fbcf28e554a51fc1c9fe3" }
bvh-trace-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "2082c4e64afaf2af605fbcf28e554a51fc1c9fe3" }
collision-lab = { path = ".." }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "2082c4e64afaf2af605fbcf28e554a51fc1c9fe3" }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "2082c4e64afaf2af605fbcf28e554a51fc1c9fe3" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "cda9d1df803eee28fca39088b0fa23753fab7233" }
serde_json = "1"
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "2082c4e64afaf2af605fbcf28e554a51fc1c9fe3" }
wasm-bindgen = "0.2"
