collision-lab = { path = ".." }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "127d9e46fc47ca8b6ceed1c42a397862365b6078" }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "127d9e46fc47ca8b6ceed1c42a397862365b6078" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "44a8f54241f4467867cd483daaa5179d4468ea02" }
serde_json = "1"
