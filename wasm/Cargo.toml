[package]
name = "collision-lab-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3ece436aa2289e1dffe4ab8f3f5ab5e5c084ccbe" }
bvh-trace-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3ece436aa2289e1dffe4ab8f3f5ab5e5c084ccbe" }
collision-lab = { path = ".." }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3ece436aa2289e1dffe4ab8f3f5ab5e5c084ccbe" }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3ece436aa2289e1dffe4ab8f3f5ab5e5c084ccbe" }
serde_json = "1"
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "3ece436aa2289e1dffe4ab8f3f5ab5e5c084ccbe" }
wasm-bindgen = "0.2"
