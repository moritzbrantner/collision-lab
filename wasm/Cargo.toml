[package]
name = "collision-lab-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "602c7a1428f143dba31af5b6c73a3c1cdf23a1bb" }
bvh-trace-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "602c7a1428f143dba31af5b6c73a3c1cdf23a1bb" }
collision-lab = { path = ".." }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "602c7a1428f143dba31af5b6c73a3c1cdf23a1bb" }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "602c7a1428f143dba31af5b6c73a3c1cdf23a1bb" }
serde_json = "1"
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "602c7a1428f143dba31af5b6c73a3c1cdf23a1bb" }
wasm-bindgen = "0.2"
