[package]
name = "collision-lab-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "1c91cf204effc8eeaddf0fc73c130ce2dd643891" }
bvh-trace-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "1c91cf204effc8eeaddf0fc73c130ce2dd643891" }
collision-lab = { path = ".." }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "1c91cf204effc8eeaddf0fc73c130ce2dd643891" }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "1c91cf204effc8eeaddf0fc73c130ce2dd643891" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "d650a43ad6ab77b7f5a565e2a38a9591245cc616" }
serde_json = "1"
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "1c91cf204effc8eeaddf0fc73c130ce2dd643891" }
wasm-bindgen = "0.2"
