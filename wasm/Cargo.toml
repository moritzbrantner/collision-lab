[package]
name = "collision-lab-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "47bf14b512840a4e91159ae4ebdebc2708b5bdec" }
bvh-trace-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "47bf14b512840a4e91159ae4ebdebc2708b5bdec" }
collision-lab = { path = ".." }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "47bf14b512840a4e91159ae4ebdebc2708b5bdec" }
octree-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "47bf14b512840a4e91159ae4ebdebc2708b5bdec" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "44a8f54241f4467867cd483daaa5179d4468ea02" }
serde_json = "1"
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "47bf14b512840a4e91159ae4ebdebc2708b5bdec" }
wasm-bindgen = "0.2"
