name: Runtime evidence and Moonlight

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUNTIME_PROFILER_REV: 8280c95feb2a1075efa0480a9622e40c723e0b3a
  MOONLIGHT_REV: a615843b6497cfa0e746224673592c107d969bda

jobs:
  broad-phase-evidence:
    name: Broad-phase runtime evidence and behavior
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Check out exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reference
          fetch-depth: 0

      - name: Check out pinned Moonlight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/moonlight
          ref: ${{ env.MOONLIGHT_REV }}
          path: moonlight

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install runtime-profiler
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler --rev "$RUNTIME_PROFILER_REV" --locked

      - name: Give the base the identical broad-phase workload
        run: |
          mkdir -p reference/profiles/runtime-profiler reference/scripts
          cp candidate/scripts/profile-broad-phase.sh reference/scripts/profile-broad-phase.sh
          cp candidate/profiles/runtime-profiler/broad-phase.json reference/profiles/runtime-profiler/broad-phase.json
          git -C reference add scripts/profile-broad-phase.sh profiles/runtime-profiler/broad-phase.json
          if ! git -C reference diff --cached --quiet; then
            git -C reference \
              -c user.name='runtime-profiler' \
              -c user.email='runtime-profiler@invalid' \
              commit -m 'chore: attach comparable broad-phase workload'
          fi

      - name: Prime deterministic workload
        run: |
          (cd reference && bash scripts/profile-broad-phase.sh >/dev/null)
          (cd candidate && bash scripts/profile-broad-phase.sh >/dev/null)

      - name: Capture reference evidence
        working-directory: reference
        run: |
          runtime-profiler capture \
            --scenario profiles/runtime-profiler/broad-phase.json \
            --output "$RUNNER_TEMP/reference-broad-phase"
          runtime-profiler validate --bundle "$RUNNER_TEMP/reference-broad-phase"

      - name: Capture candidate evidence
        working-directory: candidate
        run: |
          runtime-profiler capture \
            --scenario profiles/runtime-profiler/broad-phase.json \
            --output "$RUNNER_TEMP/candidate-broad-phase"
          runtime-profiler validate --bundle "$RUNNER_TEMP/candidate-broad-phase"

      - name: Compare runtime evidence
        run: |
          set -euo pipefail
          runtime-profiler score \
            --reference "$RUNNER_TEMP/reference-broad-phase" \
            --candidate "$RUNNER_TEMP/candidate-broad-phase" \
            --json | tee "$RUNNER_TEMP/runtime-broad-phase.json"
          {
            echo '### runtime-profiler comparison'
            echo '```json'
            cat "$RUNNER_TEMP/runtime-broad-phase.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Moonlight correctness evaluation
        working-directory: candidate
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          cargo run --quiet \
            --manifest-path ../moonlight/Cargo.toml \
            -p moonlight-cli --bin moonlight -- \
            eval run \
            --project moonlight.eval.toml \
            --storage-path .moonlight/runtime-evidence.jsonl \
            --format markdown \
            --baseline-ref "${{ github.event.pull_request.base.sha }}" \
            --candidate-ref "${{ github.event.pull_request.head.sha }}" \
            | tee "$RUNNER_TEMP/moonlight.md"
          {
            echo '### Moonlight evaluation'
            cat "$RUNNER_TEMP/moonlight.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broad-phase-runtime-moonlight-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/reference-broad-phase
            ${{ runner.temp }}/candidate-broad-phase
            ${{ runner.temp }}/runtime-broad-phase.json
            ${{ runner.temp }}/moonlight.md
          if-no-files-found: warn

  renderer-evidence:
    name: Three.js versus WASM wgpu runtime evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install runtime-profiler
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler --rev "$RUNTIME_PROFILER_REV" --locked

      - name: Build browser experiment
        working-directory: candidate/web
        run: |
          bun install
          bun run wasm
          GITHUB_ACTIONS=false bun run build
          bunx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth

      - name: Capture browser-owned frame metrics
        run: |
          set -euo pipefail
          (cd candidate && CI=true bash scripts/profile-renderer.sh three) | tee "$RUNNER_TEMP/renderer-three-browser.json"
          (cd candidate && CI=true bash scripts/profile-renderer.sh wgpu) | tee "$RUNNER_TEMP/renderer-wgpu-browser.json"

      - name: Capture Three.js command evidence
        working-directory: candidate
        run: |
          runtime-profiler capture \
            --scenario profiles/runtime-profiler/renderer-three.json \
            --output "$RUNNER_TEMP/renderer-three"
          runtime-profiler validate --bundle "$RUNNER_TEMP/renderer-three"
          runtime-profiler summarize --bundle "$RUNNER_TEMP/renderer-three" \
            | tee "$RUNNER_TEMP/renderer-three-summary.txt"

      - name: Capture WASM wgpu command evidence
        working-directory: candidate
        run: |
          runtime-profiler capture \
            --scenario profiles/runtime-profiler/renderer-wgpu.json \
            --output "$RUNNER_TEMP/renderer-wgpu"
          runtime-profiler validate --bundle "$RUNNER_TEMP/renderer-wgpu"
          runtime-profiler summarize --bundle "$RUNNER_TEMP/renderer-wgpu" \
            | tee "$RUNNER_TEMP/renderer-wgpu-summary.txt"

      - name: Publish side-by-side renderer evidence
        run: |
          {
            echo '### Browser renderer A/B evidence'
            echo
            echo '> Distinct renderer scenarios are shown side by side. They are intentionally not passed to `runtime-profiler score`, which requires semantically identical reference/candidate scenarios.'
            echo
            echo '#### Three.js / WebGL browser metrics'
            echo '```json'
            jq . "$RUNNER_TEMP/renderer-three-browser.json"
            echo '```'
            echo '```text'
            cat "$RUNNER_TEMP/renderer-three-summary.txt"
            echo '```'
            echo
            echo '#### Rust/WASM wgpu / BrowserWebGPU browser metrics'
            echo '```json'
            jq . "$RUNNER_TEMP/renderer-wgpu-browser.json"
            echo '```'
            echo '```text'
            cat "$RUNNER_TEMP/renderer-wgpu-summary.txt"
            echo '```'
            echo
            echo 'CI uses Chromium with software GPU backends for repeatability; these numbers are a regression canary, not a hardware-GPU performance claim.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload renderer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-renderer-runtime-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/renderer-three
            ${{ runner.temp }}/renderer-wgpu
            ${{ runner.temp }}/renderer-three-browser.json
            ${{ runner.temp }}/renderer-wgpu-browser.json
            ${{ runner.temp }}/renderer-three-summary.txt
            ${{ runner.temp }}/renderer-wgpu-summary.txt
          if-no-files-found: warn
